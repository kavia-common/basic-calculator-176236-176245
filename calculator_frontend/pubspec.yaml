name: calculator_frontend
description: "A simple calculator app with Ocean Professional styling."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  # Keeping dependencies aligned with the existing lockfile; no new external libs required.
  provider: ^6.1.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  # The following are present in lockfile but not needed at runtime for this app.
  # Retain them to avoid lockfile conflicts.
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
